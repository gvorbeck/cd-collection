<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CD Label Generator</title>
<style>
  :root {
    --label-size: 4.7244in; /* standard jewel case front insert, 120mm */
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #e8e8e8;
    margin: 0;
    padding: 24px;
    color: #111;
  }

  h1 {
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 16px;
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
  }

  .panel {
    display: flex;
    gap: 32px;
    align-items: flex-start;
  }

  .form {
    background: #fff;
    padding: 20px;
    border: 3px solid #111;
    width: 360px;
    flex-shrink: 0;
  }

  .form label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 14px 0 4px;
  }

  .form label:first-of-type { margin-top: 0; }

  .form input,
  .form textarea {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    border: 2px solid #111;
    font-family: inherit;
  }

  .form textarea {
    height: 160px;
    resize: vertical;
    font-family: 'Courier New', monospace;
  }

  .form .hint {
    font-size: 11px;
    color: #555;
    margin-top: 4px;
  }

  .buttons {
    margin-top: 18px;
    display: flex;
    gap: 8px;
  }

  button {
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
  }

  button.secondary {
    background: #fff;
    color: #111;
    border: 2px solid #111;
  }

  button:hover { opacity: 0.85; }

  .label-count {
    margin-top: 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #111;
  }

  .stack-list {
    margin-top: 20px;
  }

  .stack-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border: 2px solid #111;
    margin-bottom: 6px;
    font-size: 13px;
    cursor: pointer;
  }

  .stack-item:hover {
    background: #f0f0f0;
  }

  .stack-item.editing {
    background: #111;
    color: #fff;
  }

  .stack-item button {
    padding: 4px 8px;
    font-size: 11px;
  }

  .preview-area {
    flex-grow: 1;
  }

  /* --- THE LABEL ITSELF --- */
  .label {
    width: var(--label-size);
    height: var(--label-size);
    border: 6px solid #000;
    background: #fff;
    padding: 0.3in;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin-bottom: 24px;
  }

  .label-category {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 4px solid #000;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }

  .label-main {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    border-bottom: 4px solid #000;
    padding: 10px 0;
  }

  .label-artist {
    font-size: 17px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    word-break: break-word;
  }

  .label-title {
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1.05;
    letter-spacing: 1px;
    margin-top: 8px;
    word-break: break-word;
    text-wrap: balance;
  }

  .label-year {
    font-size: 13px;
    font-weight: 700;
    margin-top: 10px;
    letter-spacing: 2px;
  }

  .label-tracks {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.5;
    padding-top: 8px;
    columns: 2;
    column-gap: 14px;
  }

  .label-tracks div {
    break-inside: avoid;
    display: flex;
  }

  .track-num {
    width: 16px;
    flex-shrink: 0;
  }

  .empty-state {
    color: #666;
    font-size: 14px;
    padding: 40px;
    border: 2px dashed #999;
    text-align: center;
  }

  @media print {
    @page {
      size: letter portrait;
      margin: 0.3in;
    }
    body { background: #fff; padding: 0; margin: 0; }
    .form, h1, .no-print { display: none !important; }
    .app, .panel, .preview-area { display: block; margin: 0; padding: 0; max-width: none; }
    .label {
      border: 6px solid #000;
      page-break-inside: avoid;
      margin: 0.1in auto;
    }
    .label:nth-child(2n) {
      page-break-after: always;
    }
  }
</style>
</head>
<body>

<div class="app">
  <h1>CD Label Generator — Repo Man Style</h1>
  <div class="panel">

    <div class="form no-print">
      <label>Artist</label>
      <input type="text" id="artist" placeholder="e.g. TALKING HEADS">

      <label>Title</label>
      <input type="text" id="title" placeholder="e.g. REMAIN IN LIGHT">

      <label>Release Year</label>
      <input type="text" id="year" placeholder="e.g. 1980">

      <label>Track List</label>
      <textarea id="tracks" placeholder="One track per line"></textarea>
      <div class="hint">One song per line, in order.</div>
      <div class="buttons">
        <button class="secondary" id="fillBtn" onclick="autoFillTracks()">Auto-fill from artist + title</button>
      </div>
      <div class="hint" id="fillStatus"></div>

      <div class="buttons">
        <button id="addBtn" onclick="addLabel()">Add to print sheet</button>
        <button class="secondary" onclick="clearForm()">Clear form</button>
      </div>

      <div class="label-count no-print" id="labelCount"></div>

      <div class="stack-list" id="stackList"></div>
      <div class="hint no-print">Click a saved CD above to load it back into the form for editing.</div>

      <div class="buttons">
        <button onclick="window.print()">Print all labels</button>
        <button class="secondary" onclick="clearAll()">Clear all</button>
      </div>
    </div>

    <div class="preview-area" id="previewArea">
      <div class="empty-state no-print">No labels yet. Fill out the form and click "Add to print sheet."</div>
    </div>

  </div>
</div>

<script src="musicbrainz.js"></script>
<script>
  let labels = JSON.parse(localStorage.getItem('cdLabels') || '[]');
  let editingIndex = null;

  function saveLabels() {
    localStorage.setItem('cdLabels', JSON.stringify(labels));
  }

  function addLabel() {
    const artist = document.getElementById('artist').value.trim();
    const title = document.getElementById('title').value.trim();
    const year = document.getElementById('year').value.trim();
    const tracksRaw = document.getElementById('tracks').value.trim();

    if (!artist && !title) return;

    const tracks = tracksRaw.split('\n').map(t => t.trim()).filter(t => t.length > 0);
    const entry = { artist, title, year, tracks };

    if (editingIndex !== null) {
      labels[editingIndex] = entry;
      editingIndex = null;
    } else {
      labels.push(entry);
    }

    saveLabels();
    render();
    clearForm();
  }

  function loadForEdit(index) {
    const l = labels[index];
    document.getElementById('artist').value = l.artist;
    document.getElementById('title').value = l.title;
    document.getElementById('year').value = l.year;
    document.getElementById('tracks').value = l.tracks.join('\n');
    editingIndex = index;
    document.getElementById('addBtn').textContent = 'Save changes';
    render();
  }

  function clearForm() {
    document.getElementById('artist').value = '';
    document.getElementById('title').value = '';
    document.getElementById('year').value = '';
    document.getElementById('tracks').value = '';
    editingIndex = null;
    document.getElementById('addBtn').textContent = 'Add to print sheet';
    render();
  }

  function removeLabel(index) {
    labels.splice(index, 1);
    if (editingIndex === index) {
      clearForm();
    }
    saveLabels();
    render();
  }

  function clearAll() {
    labels = [];
    saveLabels();
    render();
  }

  function render() {
    const stackList = document.getElementById('stackList');
    const previewArea = document.getElementById('previewArea');

    // Count of saved labels + print pages (2 labels per printed page).
    const count = labels.length;
    const pages = Math.ceil(count / 2);
    document.getElementById('labelCount').textContent = count === 0
      ? ''
      : `${count} label${count === 1 ? '' : 's'} · ${pages} print page${pages === 1 ? '' : 's'}`;

    stackList.innerHTML = '';
    labels.forEach((l, i) => {
      const item = document.createElement('div');
      item.className = 'stack-item' + (editingIndex === i ? ' editing' : '');
      item.onclick = () => loadForEdit(i);

      const label = document.createElement('span');
      label.textContent = `${l.artist} — ${l.title}`;
      item.appendChild(label);

      const btn = document.createElement('button');
      btn.textContent = 'Remove';
      btn.className = 'secondary';
      btn.onclick = (e) => {
        e.stopPropagation();
        removeLabel(i);
      };
      item.appendChild(btn);
      stackList.appendChild(item);
    });

    if (labels.length === 0) {
      previewArea.innerHTML = '<div class="empty-state no-print">No labels yet. Fill out the form and click "Add to print sheet."</div>';
      return;
    }

    previewArea.innerHTML = labels.map(l => buildLabelHtml(l)).join('');
  }

  function buildLabelHtml(l) {
    let tracksHtml = '';
    if (l.tracks.length > 0) {
      tracksHtml = '<div class="label-tracks">' +
        l.tracks.map((t, i) => `<div><span class="track-num">${i + 1}.</span><span>${escapeHtml(t)}</span></div>`).join('') +
        '</div>';
    }

    return `
      <div class="label">
        <div class="label-category">Compact Disc</div>
        <div class="label-main">
          <div class="label-artist">${escapeHtml(l.artist) || 'ARTIST'}</div>
          <div class="label-title">${escapeHtml(l.title) || 'TITLE'}</div>
          <div class="label-year">${escapeHtml(l.year)}</div>
        </div>
        ${tracksHtml}
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ----------------------------------------------------------------
     Auto-fill track list + lengths from MusicBrainz.
     Key-free + CORS-friendly, same host the main collection app uses
     for cover art. Two calls: search for the best release, then look
     it up with recordings to get track titles and lengths.
  ---------------------------------------------------------------- */
  // Release endpoint; shared identity/escape/delay come from musicbrainz.js (MB).
  const MB_RELEASE = `${MB.WS_BASE}/release`;

  // One place for the shared query params (fmt/app), the Accept header, and the
  // ok-check. `path` is appended to the release endpoint ('' to search).
  async function mbFetch(path, extraParams) {
    const params = new URLSearchParams({ fmt: 'json', app: MB.APP_IDENTITY, ...extraParams });
    const res = await fetch(`${MB_RELEASE}${path}?${params}`, {
      headers: { Accept: 'application/json' },
    });
    if (!res.ok) throw new Error(`MusicBrainz ${res.status}`);
    return res.json();
  }

  // A release's 4-digit year as a number, or null when MB has no date.
  function releaseYear(rel) {
    return parseInt((rel.date || '').slice(0, 4), 10) || null;
  }

  function msToTime(ms) {
    const total = Math.round(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const ss = String(s).padStart(2, '0');
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${ss}`;
    return `${m}:${ss}`;
  }

  function setFillStatus(msg) {
    document.getElementById('fillStatus').textContent = msg || '';
  }

  // Score a search result: prefer official CD releases, then a year match.
  function scoreRelease(rel, wantYear) {
    let score = 0;
    if (rel.status === 'Official') score += 100;

    const formats = (rel.media || [])
      .map((m) => (m.format || '').toLowerCase())
      .join(' ');
    if (formats.includes('cd')) score += 50;

    const relYear = releaseYear(rel);
    if (wantYear && relYear) {
      const diff = Math.abs(relYear - wantYear);
      // Exact year wins big; otherwise closer is better.
      score += diff === 0 ? 40 : Math.max(0, 30 - diff);
    } else if (relYear) {
      // No target year: gently prefer earlier (original) pressings.
      score += Math.max(0, 30 - (relYear - 1900) / 10);
    }

    score += (rel.score || 0) / 100; // MB's own relevance as a tiebreaker.
    return score;
  }

  async function autoFillTracks() {
    const artist = document.getElementById('artist').value.trim();
    const title = document.getElementById('title').value.trim();
    const yearRaw = document.getElementById('year').value.trim();
    const wantYear = parseInt(yearRaw, 10) || null;
    const btn = document.getElementById('fillBtn');

    if (!artist || !title) {
      setFillStatus('Enter both an artist and a title first.');
      return;
    }

    btn.disabled = true;
    setFillStatus('Looking up…');

    try {
      // 1. Search for matching releases.
      const q = `artist:"${MB.escapeLucene(artist)}" AND release:"${MB.escapeLucene(title)}"`;
      const searchData = await mbFetch('', { query: q, limit: '25' });

      const releases = searchData.releases || [];
      if (releases.length === 0) {
        setFillStatus('No match found. Try tweaking the artist or title.');
        return;
      }

      // 2. Pick the best-scoring release.
      const best = releases
        .slice()
        .sort((a, b) => scoreRelease(b, wantYear) - scoreRelease(a, wantYear))[0];

      // Respect MB's ~1 req/sec rule between the two calls.
      await MB.delay(1100);

      // 3. Look it up with recordings to get track titles + lengths.
      const release = await mbFetch(`/${best.id}`, { inc: 'recordings' });

      // 4. Flatten every disc's tracks, in order.
      const lines = [];
      (release.media || []).forEach((medium) => {
        (medium.tracks || []).forEach((track) => {
          const name = track.title || (track.recording && track.recording.title) || '';
          if (!name) return;
          const len = track.length || (track.recording && track.recording.length);
          lines.push(len ? `${name} ${msToTime(len)}` : name);
        });
      });

      if (lines.length === 0) {
        setFillStatus('Found a release but no track list was available.');
        return;
      }

      document.getElementById('tracks').value = lines.join('\n');
      const yr = releaseYear(release);
      setFillStatus(`Filled ${lines.length} tracks${yr ? ` from the ${yr} release` : ''}. Edit as needed.`);
    } catch (err) {
      setFillStatus(`Lookup failed: ${err.message}. Check your connection and try again.`);
    } finally {
      btn.disabled = false;
    }
  }

  render();
</script>

</body>
</html>
