<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CD Collection</title>
  <meta name="description" content="A browsable archive of my CD collection, shelved by catalog number." />

  <!-- Installable + offline-capable: the collection is most useful in a record
       shop, which is exactly where the signal goes. See sw.js. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f5edd6" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <!-- Retro-infographic type: chunky display, slab/mono for numbers, clean sans for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Paper grain overlay: an SVG turbulence filter painted faintly over everything.
       aria-hidden because it is pure decoration. -->
  <svg class="grain" aria-hidden="true" focusable="false">
    <filter id="grain-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#grain-filter)" />
  </svg>

  <header class="site-header">
    <div class="header-inner">
      <div class="masthead">
        <!-- Same five names in the same order on every page, so the row reads as
             one nav rather than a different set of links per page. The current
             page stays in place unlinked, marked aria-current — it's what tells
             you where you are. A real <nav> so it's in the landmark list and a
             screen reader user can jump straight to it. -->
        <nav class="eyebrow" aria-label="Site"><span aria-current="page">The Collection</span> · <a href="wishlist.html">Wishlist</a> · <a href="labels.html">Labels</a> · <a href="stats.html">Statistics</a> · <a href="https://docs.google.com/spreadsheets/d/18D6C4P16KTyaPtHCgJxq7Rzc0rt_09juUbIwM06Lnmc/edit" target="_blank" rel="noopener">Shelved by Number</a></nav>
        <div class="title-row">
          <h1 class="site-title">CD Collection</h1>
          <!-- Pure-CSS compact disc, drawn with gradients. Decorative. -->
          <span class="cd-logo" aria-hidden="true"></span>
        </div>
      </div>

      <!-- Small printed "data card" of stats. Populated by app.js. -->
      <aside class="stats-card" aria-label="Collection statistics">
        <div class="stats-total">
          <span class="stats-figure" id="stat-total">—</span>
          <!-- "Releases", not "discs". renderStats fills the figure above with
               discs.length — one row of the sheet, however many CDs are in the
               box — which is exactly the number stats.html prints under
               "releases", and not the larger one it prints under "physical
               discs". The two pages sit one nav hop apart, so the word is what
               had to move: putting the disc count under the old label would
               only have relocated the disagreement. -->
          <span class="stats-label">releases on the shelf</span>
        </div>
        <!-- role=list is not redundant: .stats-genres is list-style: none and
             display: flex, and WebKit takes the list role off a <ul> styled
             that way — the genre count and "this is a list" go with it. -->
        <ul class="stats-genres" id="stat-genres" role="list"><!-- per-genre counts injected here --></ul>
      </aside>
    </div>
  </header>

  <main class="site-main">
    <!-- Controls: search + shuffle -->
    <section class="controls" aria-label="Browse controls">
      <div class="search-wrap">
        <label class="search-label" for="search">Search the collection</label>
        <!-- The placeholder says "in any order" because the search no longer
             wants one. It used to test the query as a single run against a blob
             laid out in the shelf's column order (book, number, artist, title,
             year, genre, tags, notes) — an order nobody types in, which is why
             "miles kind of blue" found nothing. searchTerms in js/discs.js
             matches each word independently now, so the old wording described a
             rule that had stopped existing. -->
        <input
          type="search"
          id="search"
          class="search-input"
          placeholder="Search artist, title, genre, tag, year — in any order"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <button type="button" id="shuffle" class="shuffle-btn">
        <!-- Standard shuffle glyph as inline SVG so it centers cleanly -->
        <svg class="shuffle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"
             fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8" />
          <line x1="4" y1="20" x2="21" y2="3" />
          <polyline points="21 16 21 21 16 21" />
          <line x1="15" y1="15" x2="21" y2="21" />
          <line x1="4" y1="4" x2="9" y2="9" />
        </svg>
        <span class="shuffle-text">Random</span>
      </button>
    </section>

    <!-- Filter pills. Two horizontally-scrolling rails: genres and tags. -->
    <section class="filters" aria-label="Filter discs">
      <div class="filter-group">
        <h2 class="filter-heading">Genre</h2>
        <div class="pill-rail" id="genre-pills" role="group" aria-label="Filter by genre">
          <!-- genre pills injected here -->
        </div>
      </div>
      <div class="filter-group">
        <h2 class="filter-heading">Tags</h2>
        <!-- A cloud, not a rail: tags grow without bound as the collection does,
             and a sideways scroller hides most of them behind a gesture. Wraps,
             and JS clips it to one line with a "show more" toggle. -->
        <div class="pill-cloud" id="tag-pills" role="group" aria-label="Filter by tag">
          <!-- tag pills injected here -->
        </div>
      </div>
    </section>

    <!-- Polite live region: announces result counts and shuffle landings to screen readers. -->
    <p class="sr-only" role="status" aria-live="polite" id="live-region"></p>

    <!-- Visible result summary + active-filter readout (never relies on color alone). -->
    <div class="results-bar">
      <!-- tabindex="-1" so "Clear filters" has somewhere to put the keyboard as
           it hides itself: hideWithoutLosingFocus in js/util.js parks focus
           here, and a <p> without it swallows the focus() call silently and
           drops the user back to <body>. -1 is not Tab-reachable — it only
           makes this a valid focus() target. -->
      <p class="results-count" id="results-count" tabindex="-1"></p>

      <!-- Shown only when the discs did not come from the live sheet: the
           committed data/collection.csv (as old as the last commit) or the
           service worker's cached copy of the sheet. Filled from loadedFrom()
           in js/collection.js once load() resolves, and hidden every other
           time — which is why it is its own element rather than #state-msg,
           whose text is already the loading, empty and error states. It borrows
           .results-count for the bar's small mono type; .sheet-stale is the
           hook for saying it louder than a count. No role=status on purpose:
           this page has exactly one live region, #live-region above, and a
           second one would double-speak. -->
      <p class="results-count sheet-stale" id="stale-notice" hidden></p>

      <div class="results-tools">
        <button type="button" class="clear-filters" id="clear-filters" hidden>Clear filters</button>

        <!-- Download the discs currently on screen, in the order shown. -->
        <button type="button" class="export-btn" id="export-csv">Export</button>

        <!-- View: the cover wall, or a dense list for scanning and printing.
             Two toggle buttons rather than a select — there are only ever two
             states and both stay visible. -->
        <div class="view-toggle" id="view-toggle" role="group" aria-label="View">
          <button type="button" data-view="grid" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
              <rect x="3" y="3" width="8" height="8" /><rect x="13" y="3" width="8" height="8" />
              <rect x="3" y="13" width="8" height="8" /><rect x="13" y="13" width="8" height="8" />
            </svg>
            <span class="sr-only">Grid view</span>
          </button>
          <button type="button" data-view="list" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
              <rect x="3" y="4" width="18" height="3" /><rect x="3" y="10.5" width="18" height="3" />
              <rect x="3" y="17" width="18" height="3" />
            </svg>
            <span class="sr-only">List view</span>
          </button>
        </div>

        <!-- Sort order. Default "random" reshuffles on every page load so the
             shelf never looks identical two visits running.
             Whichever option is `selected` here must match
             SOURCES.collection.DEFAULT_SORT in js/collection.js — url.js leaves
             the default out of the link and readStateFromUrl puts it back, so a
             mismatch quietly reorders every link this page hands out. A test in
             test/collection.test.mjs holds the two together. -->
        <div class="sort-wrap">
          <label class="sort-label" for="sort">Sort</label>
          <select class="sort-select" id="sort">
            <option value="random" selected>Random</option>
            <option value="number">Catalog #</option>
            <option value="book">Book</option>
            <option value="artist">Artist (A–Z)</option>
            <option value="title">Title (A–Z)</option>
            <option value="year-desc">Year (newest)</option>
            <option value="year-asc">Year (oldest)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- The main grid. A real list of discs.
         role=list is not redundant: .grid is list-style: none and display: grid,
         and a <ul> styled that way loses its list role in WebKit — and with it
         the "3 of 42" a screen reader counts off as you arrow through the cards.
         The <ul> supplies that for free once the role is back, so the cards need
         no roving tabindex.
         aria-label here is the pre-render default (state.view starts 'grid') and
         the no-JS fallback; labelGrid in js/render.js rewrites it on the first
         render and whenever the view toggles. -->
    <ul class="grid" id="grid" role="list" aria-label="Album covers"><!-- cards injected here --></ul>

    <!-- Empty / loading / error states (visual only — announcements go through
         the single #live-region above to avoid double-speaking to AT). -->
    <div class="state-msg" id="state-msg">Loading the collection…</div>
  </main>

  <footer class="site-footer">
    <p>An archive of physical discs. Data lives in a Google Sheet; this page just reads it.</p>
  </footer>

  <!-- Detail view. Native <dialog> gives focus trapping + Esc-to-close for free.
       Named by the album title (populated by JS) via aria-labelledby. -->
  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="detail-inner">
      <button type="button" class="detail-close" id="detail-close" aria-label="Close details">✕</button>
      <div class="detail-cover" id="detail-cover"><!-- cover injected --></div>
      <div class="detail-body">
        <p class="detail-number" id="detail-number"></p>
        <h2 class="detail-title" id="detail-title"></h2>
        <p class="detail-artist" id="detail-artist"></p>
        <dl class="detail-meta" id="detail-meta"><!-- year / genre / etc injected --></dl>
        <div class="detail-tags" id="detail-tags"><!-- tag chips injected --></div>
        <div class="detail-notes" id="detail-notes"><!-- notes injected --></div>
        <!-- Outbound lookups: Discogs / Bandcamp / iTunes / Spotify / MusicBrainz -->
        <nav class="detail-links" id="detail-links" aria-label="Look this release up"><!-- links injected --></nav>
        <!-- Tracklist, fetched from MusicBrainz on open. Hidden until it arrives. -->
        <div class="detail-tracks" id="detail-tracks" hidden><!-- tracklist injected --></div>
        <!-- Last thing in the dialog: hand this disc to the label generator,
             carrying whatever is on screen above into its form. -->
        <div class="detail-actions">
          <button type="button" class="detail-action" id="detail-make-label">Make label</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- PapaParse: robust CSV parsing (handles commas inside quoted Tags cells).
       Version-pinned + Subresource Integrity: if the CDN ever serves altered
       bytes the browser refuses to run them (the app then shows its error
       state via the catch in init). crossorigin is required for SRI here. -->
  <!-- Vendored, not linked: see vendor/README.md. Same origin, so no integrity
       or crossorigin attribute — SRI guards a file someone else is serving, and
       this one ships in the repo alongside the page that loads it. -->
  <script src="vendor/papaparse.min.js"></script>

  <!-- The app is ES modules: js/app.js pulls in the rest through imports, so
       this is the only one the page names. A module script is deferred, and
       PapaParse above is not, so window.Papa exists before any module runs. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
