# The site is static — no build step, no bundler — so there is nothing to
# compile here. This workflow exists only to hand the repository to Pages
# directly, replacing the legacy branch-based pipeline that ran Jekyll over
# files that were never Jekyll to begin with.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a failed publish can be retried without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Not cancel-in-progress: a half-published site is
# worse than a queued one, and deploys here are rare enough to just wait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The repository root is the site. CNAME travels with it, which is what
      # keeps the custom domain attached.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
